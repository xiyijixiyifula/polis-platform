[workspace]
resolver = "2"
members = [
    "crates/polis-core",
    "crates/polis-gateway",
    "crates/polis-user",
    "crates/polis-space",
    "crates/polis-content",
    "crates/polis-search",
    "crates/polis-aggregate",
    "crates/polis-notify",
    "crates/polis-video",
    "crates/polis-chat",
    "crates/polis-code",
    "crates/polis-store",
    "crates/polis-pay",
    "crates/polis-export",
    "crates/polis-plugin-engine",
    "crates/polis-admin",
    "crates/polisctl",
    "crates/polis-chain",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Polis Team"]
description = "Polis - Decentralized community platform"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "derive", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# JWT
jsonwebtoken = "9"

# Password hashing
argon2 = "0.5"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Config
config = "0.14"
dotenvy = "0.15"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }

# Crypto (Webhook HMAC signing)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Error handling
thiserror = "2"
anyhow = "1"

# Redis
redis = { version = "0.27", features = ["tokio-comp", "json"] }

# Object storage
aws-sdk-s3 = "1"

# Messaging (NATS)
async-nats = "0.38"

# WASM runtime
wasmtime = "24"

# Git
git2 = "0.19"

# Telemetry
opentelemetry = "0.25"
opentelemetry-otlp = "0.25"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Regex
regex = "1"

# Async utilities
futures = "0.3"
futures-util = "0.3"

# Testing
rstest = "0.22"
testcontainers = "0.23"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
