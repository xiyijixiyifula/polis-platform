name: Build & Release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

jobs:
  build-backend:
    name: Build Rust Backend (x86_64-linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Lint Backend (clippy)
        run: |
          rm -f .cargo/config.toml
          cargo clippy --workspace -- -D warnings

      - name: Security Audit (Rust)
        run: |
          cargo install cargo-audit --locked
          cargo audit
        continue-on-error: true

      - name: Test Backend (workspace)
        run: cargo test --workspace --release --no-fail-fast

      - name: Build Backend (native, no cross-compile)
        run: |
          rm -f .cargo/config.toml
          for svc in polis-gateway polis-user polis-space polis-content polis-admin polis-video polis-aggregate polis-chain; do
            cargo build -p $svc --release
          done

      - name: Package Backend
        run: |
          mkdir -p release-binaries
          for svc in polis-gateway polis-user polis-space polis-content polis-admin polis-video polis-aggregate polis-chain; do
            cp target/release/$svc release-binaries/
          done
          tar -czf release-binaries.tar.gz release-binaries/

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-linux
          path: release-binaries.tar.gz

  build-frontend:
    name: Build Next.js Frontend
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Lint Frontend (ESLint)
        run: npm run lint || true
        continue-on-error: true

      - name: Test Frontend (Vitest)
        run: npm test

      - name: Security Audit (npm)
        run: npm audit --production
        continue-on-error: true

      - name: Build Frontend
        run: npm run build

      - name: Package Frontend
        run: tar -czf release-web.tar.gz .next next.config.js package.json

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: web/release-web.tar.gz

  release:
    name: Create Release
    needs: [build-backend, build-frontend]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend-linux/release-binaries.tar.gz
            frontend/release-web.tar.gz
          generate_release_notes: true

  smoke-test:
    name: Post-Deploy Smoke Test
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Production Health Check
        run: |
          sleep 10
          echo "=== Smoke Test: Production Health Check ==="

          # 1. Homepage
          HTTP_HOME=$(curl -fsk -o /dev/null -w "%{http_code}" --max-time 15 https://www.mzgw.com/)
          if [ "$HTTP_HOME" = "200" ]; then
            echo "PASS: Homepage -> HTTP $HTTP_HOME"
          else
            echo "FAIL: Homepage -> HTTP $HTTP_HOME"
            exit 1
          fi

          # 2. API health
          HTTP_HEALTH=$(curl -fsk -o /dev/null -w "%{http_code}" --max-time 15 https://www.mzgw.com/api/health)
          if [ "$HTTP_HEALTH" = "200" ]; then
            echo "PASS: /api/health -> HTTP $HTTP_HEALTH"
          else
            echo "FAIL: /api/health -> HTTP $HTTP_HEALTH"
            exit 1
          fi

          # 3. Aggregated health (all services)
          HTTP_ALL=$(curl -fsk -o /dev/null -w "%{http_code}" --max-time 15 https://www.mzgw.com/api/health/all)
          if [ "$HTTP_ALL" = "200" ]; then
            echo "PASS: /api/health/all -> HTTP $HTTP_ALL"
          else
            echo "FAIL: /api/health/all -> HTTP $HTTP_ALL"
            exit 1
          fi

          # 4. Trending spaces (key public endpoint)
          HTTP_TREND=$(curl -fsk -o /dev/null -w "%{http_code}" --max-time 15 https://www.mzgw.com/api/spaces/trending)
          if [ "$HTTP_TREND" = "200" ]; then
            echo "PASS: /api/spaces/trending -> HTTP $HTTP_TREND"
          else
            echo "FAIL: /api/spaces/trending -> HTTP $HTTP_TREND"
            exit 1
          fi

          # 5. Feed (key public endpoint)
          HTTP_FEED=$(curl -fsk -o /dev/null -w "%{http_code}" --max-time 15 "https://www.mzgw.com/api/feed?limit=5")
          if [ "$HTTP_FEED" = "200" ]; then
            echo "PASS: /api/feed -> HTTP $HTTP_FEED"
          else
            echo "FAIL: /api/feed -> HTTP $HTTP_FEED"
            exit 1
          fi

          echo ""
          echo "=== ALL SMOKE TESTS PASSED ==="
